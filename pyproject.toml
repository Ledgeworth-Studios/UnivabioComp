[project]
name = "whynot"
version = "0.1.0"
description = "Why Not This Trial — a clinical-trial finder that explains why you don't qualify"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["whynot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, UP pyupgrade, B bugbear.
# Deliberately a small, explainable set — every rule here is one a human can
# justify to a judge without reading the ruff manual.
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
