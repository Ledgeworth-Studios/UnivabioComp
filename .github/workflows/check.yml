# Runs the same command a build agent must run before marking a task done.
#
# The local gate and the remote gate are deliberately the *same command*, not two
# lists that happen to overlap. A CI job that checks a subset of what runs locally
# produces confidence proportional to what it skips.

name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install the project
        run: uv sync --extra dev

      # Lint, format check, tests. Tests make no network calls — see
      # tests/conftest.py — so this job needs no secrets and none are provided.
      - name: just check
        run: just check

  # The web interface is checked by its own job, and by the same command a person
  # would run locally: `just web-check`. It is deliberately not folded into
  # `just check`, which is the Python gate — a Python-only task should not have to
  # install node to find out whether it passed.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install just
        uses: extractions/setup-just@v2

      # npm ci, oxlint, vitest, then `tsc -b && vite build` — the type check is
      # part of the build script, so a type error fails this job too. Adding a
      # step to `just web-check` adds it here for free; that is the point.
      - name: just web-check
        run: just web-check
